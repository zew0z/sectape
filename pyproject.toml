[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sectape"
dynamic = ["version"]
description = "Record a terminal session as commands, not bytes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["terminal", "pty", "recording", "shell", "transcript", "asciinema", "script"]
authors = [{ name = "zew0z" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Shells",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zew0z/sectape"
Issues = "https://github.com/zew0z/sectape/issues"

[project.scripts]
sectape = "sectape.cli:main"

[tool.hatch.version]
path = "src/sectape/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sectape"]
